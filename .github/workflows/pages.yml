# GitHub Pages の確認用プレビューは役目を終えたので、本番サイトへの転送だけを置く。
#
# 以前はここでサイトを静的に書き出して公開していたが、本番（Netlify）ができたので
# 中身を差し替えた。古い URL（https://kizunajamjam.github.io/pentathlon-academy/...）を
# 開いた人やブックマークは、同じページの本番 URL へ移動する。
#
# GitHub の Settings → Pages で公開を止めれば、このワークフローごと削除してよい。
name: Redirect GitHub Pages to production

on:
  # このファイルを変えたときと、手動のときだけ動かす（毎日の作り直しはやめた）
  push:
    branches: [main]
    paths: [".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # どのパスで開かれても、トップの index.html か 404.html が返る。
      # どちらも同じ転送ページにし、/pentathlon-academy を外した同じパスへ送る。
      - name: 転送ページを作る
        run: |
          mkdir -p out
          cat > out/index.html <<'HTML'
          <!doctype html>
          <html lang="ja">
          <head>
          <meta charset="utf-8">
          <meta name="robots" content="noindex">
          <link rel="canonical" href="https://pentathlon-academy.com/">
          <meta http-equiv="refresh" content="0; url=https://pentathlon-academy.com/">
          <title>ペンタスロンアカデミー</title>
          <script>
            var path = location.pathname.replace(/^\/pentathlon-academy/, "") || "/";
            location.replace("https://pentathlon-academy.com" + path + location.search + location.hash);
          </script>
          </head>
          <body>
          <p>このページは移転しました。<a href="https://pentathlon-academy.com/">https://pentathlon-academy.com/</a> をご覧ください。</p>
          </body>
          </html>
          HTML
          cp out/index.html out/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
