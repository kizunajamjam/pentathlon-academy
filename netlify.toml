# Netlify の設定。本番サイトはここで動かす（Next.js の機能はそのまま使える）。
# 確認用プレビュー（GitHub Pages）は .github/workflows/pages.yml で別に作っている。
[build]
  base = "app"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Next.js をサーバー機能ごと動かすためのプラグイン。
# 画面から作ったサイトでは自動で付くはずだが、付かないことがあった（ページが全部 404 になる）ので明示する。
[[plugins]]
  package = "@netlify/plugin-nextjs"
